<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[14.69642870162006,72.57136847700812],[16.033540876003407,74.87172922438472]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GEBCO_LATEST_0');
        map.getPane('pane_GEBCO_LATEST_0').style.zIndex = 400;
        var img_GEBCO_LATEST_0 = 'data/GEBCO_LATEST_0.png';
        var img_bounds_GEBCO_LATEST_0 = [[14.700000000000001,73.30000000000001],[15.899999999999993,74.4]];
        var layer_GEBCO_LATEST_0 = new L.imageOverlay(img_GEBCO_LATEST_0,
                                              img_bounds_GEBCO_LATEST_0,
                                              {pane: 'pane_GEBCO_LATEST_0'});
        bounds_group.addLayer(layer_GEBCO_LATEST_0);
        map.addLayer(layer_GEBCO_LATEST_0);
        map.createPane('pane_OSMStandard_1');
        map.getPane('pane_OSMStandard_1').style.zIndex = 401;
        var layer_OSMStandard_1 = L.tileLayer('http://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_1',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_1;
        map.addLayer(layer_OSMStandard_1);
        map.createPane('pane_SalinityZones_2');
        map.getPane('pane_SalinityZones_2').style.zIndex = 402;
        var img_SalinityZones_2 = 'data/SalinityZones_2.png';
        var img_bounds_SalinityZones_2 = [[14.791666666666664,72.45834865570069],[15.874999999999998,74.2083459854126]];
        var layer_SalinityZones_2 = new L.imageOverlay(img_SalinityZones_2,
                                              img_bounds_SalinityZones_2,
                                              {pane: 'pane_SalinityZones_2'});
        bounds_group.addLayer(layer_SalinityZones_2);
        map.addLayer(layer_SalinityZones_2);
        map.createPane('pane_suitable_zones_for_sea_cage_3');
        map.getPane('pane_suitable_zones_for_sea_cage_3').style.zIndex = 403;
        var img_suitable_zones_for_sea_cage_3 = 'data/suitable_zones_for_sea_cage_3.png';
        var img_bounds_suitable_zones_for_sea_cage_3 = [[14.7,73.3],[15.9,74.4]];
        var layer_suitable_zones_for_sea_cage_3 = new L.imageOverlay(img_suitable_zones_for_sea_cage_3,
                                              img_bounds_suitable_zones_for_sea_cage_3,
                                              {pane: 'pane_suitable_zones_for_sea_cage_3'});
        bounds_group.addLayer(layer_suitable_zones_for_sea_cage_3);
        map.addLayer(layer_suitable_zones_for_sea_cage_3);
        map.createPane('pane_BrackishFarms_4');
        map.getPane('pane_BrackishFarms_4').style.zIndex = 404;
        var img_BrackishFarms_4 = 'data/BrackishFarms_4.png';
        var img_bounds_BrackishFarms_4 = [[14.700000000000001,73.30000000000001],[15.899999999999993,74.4]];
        var layer_BrackishFarms_4 = new L.imageOverlay(img_BrackishFarms_4,
                                              img_bounds_BrackishFarms_4,
                                              {pane: 'pane_BrackishFarms_4'});
        bounds_group.addLayer(layer_BrackishFarms_4);
        map.addLayer(layer_BrackishFarms_4);
        map.createPane('pane_BathymetryOceanDepth_5');
        map.getPane('pane_BathymetryOceanDepth_5').style.zIndex = 405;
        var img_BathymetryOceanDepth_5 = 'data/BathymetryOceanDepth_5.png';
        var img_bounds_BathymetryOceanDepth_5 = [[14.700000000000001,73.30000000000001],[15.899999999999993,74.4]];
        var layer_BathymetryOceanDepth_5 = new L.imageOverlay(img_BathymetryOceanDepth_5,
                                              img_bounds_BathymetryOceanDepth_5,
                                              {pane: 'pane_BathymetryOceanDepth_5'});
        bounds_group.addLayer(layer_BathymetryOceanDepth_5);
        map.addLayer(layer_BathymetryOceanDepth_5);
        map.createPane('pane_Westwardseawatervelocity_6');
        map.getPane('pane_Westwardseawatervelocity_6').style.zIndex = 406;
        var img_Westwardseawatervelocity_6 = 'data/Westwardseawatervelocity_6.png';
        var img_bounds_Westwardseawatervelocity_6 = [[14.791666666666664,73.45834870771928],[15.791666666666666,74.458345933394]];
        var layer_Westwardseawatervelocity_6 = new L.imageOverlay(img_Westwardseawatervelocity_6,
                                              img_bounds_Westwardseawatervelocity_6,
                                              {pane: 'pane_Westwardseawatervelocity_6'});
        bounds_group.addLayer(layer_Westwardseawatervelocity_6);
        map.addLayer(layer_Westwardseawatervelocity_6);
        map.createPane('pane_Eastwardseawatervelocity_7');
        map.getPane('pane_Eastwardseawatervelocity_7').style.zIndex = 407;
        var img_Eastwardseawatervelocity_7 = 'data/Eastwardseawatervelocity_7.png';
        var img_bounds_Eastwardseawatervelocity_7 = [[14.791666666666664,73.45834870771928],[15.791666666666666,74.458345933394]];
        var layer_Eastwardseawatervelocity_7 = new L.imageOverlay(img_Eastwardseawatervelocity_7,
                                              img_bounds_Eastwardseawatervelocity_7,
                                              {pane: 'pane_Eastwardseawatervelocity_7'});
        bounds_group.addLayer(layer_Eastwardseawatervelocity_7);
        map.addLayer(layer_Eastwardseawatervelocity_7);
        var overlaysTree = [
            {label: "Eastward sea water velocity", layer: layer_Eastwardseawatervelocity_7},
            {label: "Westward sea water velocity", layer: layer_Westwardseawatervelocity_6},
            {label: "Bathymetry(Ocean Depth)", layer: layer_BathymetryOceanDepth_5},
            {label: "Brackish Farms ", layer: layer_BrackishFarms_4},
            {label: "suitable_zones_for_sea_cage", layer: layer_suitable_zones_for_sea_cage_3},
            {label: "Salinity Zones", layer: layer_SalinityZones_2},
            {label: "OSM Standard", layer: layer_OSMStandard_1},
            {label: "GEBCO_LATEST", layer: layer_GEBCO_LATEST_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        
            // Listener for messages from Flutter (Dart -> iframe)
            window.addEventListener('message', function(e) {
                try {
                    var data = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data;
                    if (!data) return;

                    // Ensure marker layers exist
                    if(!window.flutterMarkersLayer){ window.flutterMarkersLayer = L.layerGroup().addTo(map); }
                    if(!window.flutterComplaintsLayer){ window.flutterComplaintsLayer = L.layerGroup().addTo(map); }

                    window.flutterMarkersLayer.clearLayers();
                    window.flutterComplaintsLayer.clearLayers();

                    if (data.farms && Array.isArray(data.farms)) {
                        data.farms.forEach(function(f){
                            if(!f.lat || !f.lng) return;
                            var color = (f.status === 'Active')? 'green' : (f.status === 'Pending Approval'? 'orange' : (f.status === 'Rejected'? 'red' : 'gray'));
                            var m = L.circleMarker([f.lat, f.lng], {radius:7, color: color, fillColor: color, fillOpacity:0.9}).addTo(window.flutterMarkersLayer);
                            var btnId = 'openFarm-' + (f.id||Math.random().toString(36).substr(2,5));
                            var popup = '<div><strong>' + (f.name||'') + '</strong><br/>' + (f.owner||'') + '<br/><small>' + (f.status||'') + '</small><br/><button id="' + btnId + '">VIEW MORE DETAILS</button></div>';
                            m.bindPopup(popup);
                            m.on('popupopen', function(){
                                var btn = document.getElementById(btnId);
                                if(btn){
                                    btn.onclick = function(){
                                        try{
                                            if(window.parent && window.parent !== window){
                                                parent.postMessage(JSON.stringify({type:'openFarm', id: f.id}), '*');
                                            } else {
                                                window.location.href = 'app://farm/' + f.id;
                                            }
                                        } catch(e){ console.error(e); }
                                    };
                                }
                            });
                        });
                    }

                    if (data.complaints && Array.isArray(data.complaints)) {
                        data.complaints.forEach(function(c){
                            if(!c.lat || !c.lng) return;
                            var cm = L.circleMarker([c.lat,c.lng],{radius:6, color:'purple', fillColor:'purple', fillOpacity:0.8}).addTo(window.flutterComplaintsLayer);
                            cm.bindPopup('<b>Activity:</b> '+(c.activityType||'') + '<br/>' + (c.description||''));
                        });
                    }
                } catch(err) {
                    console.error('Error processing message from Flutter:', err);
                }
            }, false);
        </script>        
    </body>
</html>
